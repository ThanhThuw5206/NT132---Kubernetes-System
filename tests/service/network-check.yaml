# Ephemeral infrastructure test only; application choice belongs to TV2.
apiVersion: v1
kind: Namespace
metadata:
  name: network-check
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: network-check
  labels:
    app: network-check-server
spec:
  nodeSelector:
    nt132.lab/worker: wk-01
  containers:
    - name: http
      image: nginx:1.28.0-alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: network-check
spec:
  selector:
    app: network-check-server
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: network-check
spec:
  nodeSelector:
    nt132.lab/worker: wk-02
  containers:
    - name: curl
      image: curlimages/curl:8.14.1
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 20m
          memory: 16Mi
        limits:
          memory: 64Mi
