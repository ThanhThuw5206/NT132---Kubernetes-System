fullnameOverride: rancher-ingress
deployment:
  replicas: 1
service:
  spec:
    type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: false
  name: rancher-traefik
providers:
  kubernetesIngress:
    enabled: true
    ingressClass: rancher-traefik
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi
